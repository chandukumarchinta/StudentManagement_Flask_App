<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="auth-shell">
    <div class="auth-card">
        <a href="{{ url_for('students.home') }}" class="back-link">&larr; Back to Dashboard</a>

        <div class="auth-icon">
            <span>✎</span>
        </div>

        <h2>Add Student</h2>
        <p class="auth-subtitle">Create a student record below.</p>

        <form method="POST" action="{{ url_for('students.add_student') }}" class="auth-form">
            <div class="auth-field">
                <label for="student_name">Full Name</label>
                <input id="student_name" type="text" name="student_name" placeholder="Enter full name" required>
            </div>

            <div class="auth-field">
                <label for="email_address">Email Address</label>
                <input id="email_address" type="email" name="email_address" placeholder="Enter email address" required>
            </div>

            <div class="auth-field">
                <label for="phone_number">Phone Number</label>
                <input id="phone_number" type="text" name="phone_number" placeholder="Enter phone number" required>
            </div>

            <button type="submit" class="auth-submit">Save Student</button>
        </form>
    </div>
</div>
</body>
</html>

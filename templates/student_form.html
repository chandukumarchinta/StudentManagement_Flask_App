<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card">
            <a href="{{ url_for('students.home') }}" class="back-link">&larr; Back to Dashboard</a>
            
            <div class="auth-icon">
                <span>+</span>
            </div>

            <h2>Add New Student</h2>
            <p class="auth-subtitle">Enter student details to register in the system</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <div class="mb-3">
                  {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
                      {{ message }}
                      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form class="auth-form" method="POST" action="{{ url_for('students.add_student') }}">
                <div class="auth-field">
                    <label for="student_name">STUDENT NAME</label>
                    <input type="text" id="student_name" name="student_name" placeholder="Enter student's full name" required autofocus>
                </div>

                <div class="auth-field">
                    <label for="email_address">EMAIL ADDRESS</label>
                    <input type="email" id="email_address" name="email_address" placeholder="name@example.com" required>
                </div>

                <div class="auth-field">
                    <label for="phone_number">PHONE NUMBER</label>
                    <input type="tel" id="phone_number" name="phone_number" placeholder="Enter phone number" required>
                </div>

                <button type="submit" class="auth-submit">Add Student</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
